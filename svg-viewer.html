<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SVG Viewer / Frame Player</title>
<style>
  :root { --bg:#f3f4f6; --panel:#fff; --text:#1f2937; --muted:#6b7280; --line:#d1d5db; --accent:#2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111827; --panel:#1f2937; --text:#f3f4f6; --muted:#9ca3af; --line:#374151; --accent:#60a5fa; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  .bar.bottom { border-top: 1px solid var(--line); border-bottom: 0; }
  button, label.btn { font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled), label.btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:focus-visible, label.btn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  label.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
  input[type=number] { width: 4.5em; font: inherit; padding: 5px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); color: var(--text); }
  .grp { display: flex; align-items: center; gap: 6px; }
  .grow { flex: 1; min-width: 160px; }
  #name { color: var(--muted); font-size: 14px; margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40ch; }
  #info { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
  #msg { padding: 0 16px; min-height: 1.4em; font-size: 14px; color: var(--muted); }
  #msg.err { color: #dc2626; }
  #stage { flex: 1; min-height: 0; margin: 8px 16px 16px; border: 2px dashed var(--line); border-radius: 8px; display: flex; align-items: center; justify-content: center; overflow: auto; background: var(--panel); }
  #stage.drag { border-color: var(--accent); }
  #stage.checker { background-image: linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%), linear-gradient(45deg, rgba(128,128,128,.15) 25%, transparent 25%, transparent 75%, rgba(128,128,128,.15) 75%); background-size: 20px 20px; background-position: 0 0, 10px 10px; }
  #hint { color: var(--muted); text-align: center; padding: 24px; }
  #view { transform-origin: center; }
  #view img { display: none; max-width: 100%; max-height: 100%; }
  #view img.cur { display: block; }
</style>
</head>
<body>
<div class="bar">
  <label class="btn primary">Open SVG<input type="file" id="file" accept=".svg,image/svg+xml"></label>
  <label class="btn primary">Open folder<input type="file" id="folder" webkitdirectory multiple></label>
  <span id="name">Nothing loaded</span>
  <div class="grp">
    <button id="zoomOut" title="Zoom out" disabled>−</button>
    <button id="zoomIn" title="Zoom in" disabled>+</button>
    <button id="zoomReset" title="Reset zoom" disabled>100%</button>
    <button id="bg" title="Toggle checkerboard background" disabled>Background</button>
  </div>
</div>
<div id="msg" role="status"></div>
<main id="stage">
  <div id="hint">Open an SVG file or a folder of SVG frames, or drop them here.</div>
  <div id="view"></div>
</main>
<div class="bar bottom">
  <div class="grp">
    <button id="first" title="First frame (Home)" disabled>⏮</button>
    <button id="prev" title="Previous frame (←)" disabled>◀</button>
    <button id="play" title="Play / pause (Space)" disabled>▶ Play</button>
    <button id="next" title="Next frame (→)" disabled>▶</button>
    <button id="last" title="Last frame (End)" disabled>⏭</button>
    <button id="stop" title="Stop and return to first frame" disabled>⏹ Stop</button>
    <button id="loop" title="Loop playback" class="on" disabled>Loop</button>
  </div>
  <input type="range" id="scrub" class="grow" min="0" max="0" value="0" aria-label="Frame" disabled>
  <span id="info">–</span>
  <div class="grp">
    <label for="fps">FPS</label>
    <input type="range" id="fpsRange" min="1" max="60" value="12" aria-label="Frame rate" disabled>
    <input type="number" id="fps" min="1" max="60" step="1" value="12" disabled>
  </div>
</div>

<script>
(function () {
  const $ = id => document.getElementById(id);
  const stage = $('stage'), view = $('view'), hint = $('hint'), msg = $('msg');
  const ctrl = ['first','prev','play','next','last','stop','loop','scrub','fpsRange','fps'].map($);
  const zoomBtns = ['zoomIn','zoomOut','zoomReset','bg'].map($);

  let frames = [];      // { name, url, img }
  let idx = 0, playing = false, looping = true;
  let fps = 12, zoom = 1, last = 0, acc = 0, raf = 0;

  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });
  const isSvg = f => f.type === 'image/svg+xml' || /\.svg$/i.test(f.name);

  function say(text, isErr) { msg.textContent = text || ''; msg.className = isErr ? 'err' : ''; }

  function setZoom(z) {
    zoom = Math.min(10, Math.max(0.1, z));
    view.style.transform = 'scale(' + zoom + ')';
    $('zoomReset').textContent = Math.round(zoom * 100) + '%';
  }

  function show(i) {
    if (!frames.length) return;
    frames[idx].img.classList.remove('cur');
    idx = i;
    frames[idx].img.classList.add('cur');
    $('scrub').value = idx;
    $('info').textContent = (idx + 1) + ' / ' + frames.length + '  ' + frames[idx].name;
  }

  function setPlaying(p) {
    if (p && frames.length < 2) p = false;
    playing = p;
    $('play').textContent = p ? '⏸ Pause' : '▶ Play';
    cancelAnimationFrame(raf);
    if (p) {
      // at the end without looping, restart from the first frame
      if (!looping && idx === frames.length - 1) show(0);
      last = performance.now(); acc = 0;
      raf = requestAnimationFrame(tick);
    }
  }

  function tick(now) {
    acc += now - last; last = now;
    const step = 1000 / fps;
    if (acc >= step) {
      const n = Math.floor(acc / step);
      acc -= n * step;
      let next = idx + n;
      if (next >= frames.length) {
        if (looping) next %= frames.length;
        else { show(frames.length - 1); setPlaying(false); return; }
      }
      show(next);
    }
    raf = requestAnimationFrame(tick);
  }

  function setFps(v) {
    v = Math.min(60, Math.max(1, Math.round(Number(v)) || 1));
    fps = v; $('fps').value = v; $('fpsRange').value = v;
  }

  async function load(fileList) {
    setPlaying(false);
    const files = Array.from(fileList).filter(isSvg);
    if (!files.length) { say('No SVG files found.', true); return; }
    // Sort by file name (natural order: frame2 before frame10), then by path.
    files.sort((a, b) => collator.compare(a.name, b.name) ||
      collator.compare(a.webkitRelativePath || '', b.webkitRelativePath || ''));
    say('Loading ' + files.length + ' file(s)…');

    const loaded = [], skipped = [];
    for (const f of files) {
      try {
        const text = await f.text();
        const doc = new DOMParser().parseFromString(text, 'image/svg+xml');
        if (doc.querySelector('parsererror') || doc.documentElement.nodeName.toLowerCase() !== 'svg') throw 0;
        // Rendered via <img>, so scripts inside the SVG do not run.
        const url = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
        const img = new Image(); img.alt = f.name; img.src = url;
        try { await img.decode(); } catch (e) {}
        loaded.push({ name: f.name, url, img });
      } catch (e) { skipped.push(f.name); }
    }
    if (!loaded.length) { say('None of the files are valid SVG.', true); return; }

    frames.forEach(fr => URL.revokeObjectURL(fr.url));
    frames = loaded; idx = 0;
    view.replaceChildren(...frames.map(f => f.img));
    frames[0].img.classList.add('cur');
    hint.style.display = 'none';

    const multi = frames.length > 1;
    $('scrub').max = frames.length - 1; $('scrub').value = 0;
    ctrl.forEach(c => c.disabled = !multi);
    zoomBtns.forEach(b => b.disabled = false);
    $('name').textContent = multi ? frames.length + ' frames' : frames[0].name;
    show(0);
    setZoom(1);
    say(skipped.length ? 'Skipped ' + skipped.length + ' invalid file(s): ' + skipped.slice(0, 3).join(', ') + (skipped.length > 3 ? '…' : '') : '', !!skipped.length);
  }

  $('file').addEventListener('change', e => { load(e.target.files); e.target.value = ''; });
  $('folder').addEventListener('change', e => { load(e.target.files); e.target.value = ''; });

  ['dragenter','dragover'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.add('drag'); }));
  ['dragleave','drop'].forEach(t => stage.addEventListener(t, e => { e.preventDefault(); stage.classList.remove('drag'); }));
  stage.addEventListener('drop', e => load(e.dataTransfer.files));

  $('play').onclick = () => setPlaying(!playing);
  $('stop').onclick = () => { setPlaying(false); show(0); };
  $('first').onclick = () => { setPlaying(false); show(0); };
  $('last').onclick = () => { setPlaying(false); show(frames.length - 1); };
  $('prev').onclick = () => { setPlaying(false); show((idx - 1 + frames.length) % frames.length); };
  $('next').onclick = () => { setPlaying(false); show((idx + 1) % frames.length); };
  $('loop').onclick = e => { looping = !looping; e.currentTarget.classList.toggle('on', looping); };
  $('scrub').oninput = e => { setPlaying(false); show(Number(e.target.value)); };
  $('fpsRange').oninput = e => setFps(e.target.value);
  $('fps').onchange = e => setFps(e.target.value);

  $('zoomIn').onclick = () => setZoom(zoom * 1.25);
  $('zoomOut').onclick = () => setZoom(zoom / 1.25);
  $('zoomReset').onclick = () => setZoom(1);
  $('bg').onclick = () => stage.classList.toggle('checker');

  document.addEventListener('keydown', e => {
    if (frames.length < 2 || /^(INPUT|BUTTON)$/.test(e.target.tagName) && e.target.type !== 'range' && e.key === ' ') return;
    if (e.target.tagName === 'INPUT' && e.target.type === 'number') return;
    if (e.key === ' ') { e.preventDefault(); $('play').click(); }
    else if (e.key === 'ArrowLeft' && e.target.type !== 'range') $('prev').click();
    else if (e.key === 'ArrowRight' && e.target.type !== 'range') $('next').click();
    else if (e.key === 'Home' && e.target.type !== 'range') $('first').click();
    else if (e.key === 'End' && e.target.type !== 'range') $('last').click();
  });
})();
</script>
</body>
</html>
